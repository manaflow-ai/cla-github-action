name: "CLA assistant lite"
description: "An action to handle the Contributor License Agreement (CLA) and Developer Certificate of Origin (DCO)"
author: "SAP"
branding:
  icon: "award"
  color: blue
inputs:
  mode:
    description: >
      Execution mode. The default 'sign' mode reads and updates the configured
      signature ledger. Set 'signer-preflight' only in an unprivileged gate to
      authenticate the current exact signing comment and emit
      'signer_authorized' without writing comments or signature data.
    default: "sign"
  path-to-signatures:
    description: "Give a path for storing CLAs in a json file "
    default: "./signatures/cla.json"
  branch:
    description: "Branch where signatures are stored. Restrict writes to trusted CLA automation and ensure its token can write."
    default: "master"
  required-base-ref:
    description: "Pull Request base branch allowed to write signatures or be locked after merge. Repositories that accept contributions to another branch must override the secure main default."
    default: "main"
  expected-head-sha:
    description: >
      Optional exact live Pull Request head commit SHA observed by a preceding
      read-only signer-preflight. When set, both signer-preflight and the
      write-capable signer fail closed if the live head differs.
    default: ""
  expected-base-sha:
    description: >
      Optional exact live Pull Request base commit SHA observed by a preceding
      read-only signer-preflight. When set, both signer-preflight and the
      write-capable signer fail closed if the live base differs.
    default: ""
  allowlist:
    description: "Deprecated and ignored. Raw names, emails, and globs can be spoofed in commit metadata."
    default: ""
  allowlist-ids:
    description: "Comma-separated numeric GitHub user IDs. An ID is exempt only when the live Pull Request API authenticates it as the opener. Commit-derived identities are never exempt."
    default: ""
  remote-repository-name:
    description: "provide the remote repository name where all the signatures should be stored"
  remote-organization-name:
    description: "provide the remote organization name where all the signatures should be stored"
  path-to-document:
    description: "Non-empty absolute HTTPS URL for the CLA or DCO document"
    required: true
  signed-commit-message:
    description: "Commit message when a new contributor signs the CLA in a PR"
  create-file-commit-message:
    description: "Commit message when a new file is created"
  custom-notsigned-prcomment:
    description: "Introductory message to ask new contributors to sign"
  custom-pr-sign-comment:
    description: "The signature to be committed in order to sign the CLA."
  custom-allsigned-prcomment:
    description: "pull request comment when everyone has signed, defaults to **CLA Assistant Lite** All Contributors have signed the CLA."
  use-dco-flag:
    description: "Set this to true if you want to use a dco instead of a cla"
    default: "false"
  lock-pullrequest-aftermerge:
    description: "Will lock the pull request after merge so that the signature the contributors cannot revoke their signature comments after merge"
    default: "true"
  suggest-recheck:
    description: "Controls whether or not the action's comment should suggest that users comment `recheck`."
    default: "true"
  require-opener-as-author:
    description: >
      When 'true' (the default), fail the check if the Pull Request opener is
      not recorded as an author or co-author of any commit in the PR. This
      guards against an attacker opening a PR whose commits are attributed to
      a trusted identity the attacker does not control. Set to 'false' for
      workflows where the PR submitter legitimately pushes commits authored by
      others (cherry-picks, release-engineering patch submission, mailing-list
      style contribution workflows).
    default: "true"
outputs:
  signer_authorized:
    description: >
      Set to 'true' only when signer-preflight mode verifies that the current
      exact, unedited signing comment belongs to an authenticated identity in
      the live Pull Request's author, co-author, committer, or opener set.
      This output is an admission result, not a replacement for the normal
      write-capable action's live revalidation.
  signature_recorded:
    description: >
      Set to 'true' only when this run accepted a new Pull Request signing
      comment and persisted that signature in the ledger. Consumers can use
      this output to authorize a narrowly scoped post-signature check refresh.
  opener_not_in_commits:
    description: >
      Set to 'true' when the Pull Request opener is not recorded as an author
      or co-author of any commit in the PR. Emitted regardless of whether
      'require-opener-as-author' caused the check to fail, so repositories
      can gate additional workflows (e.g. branch protection rules) on this
      output independently of the CLA-check pass/fail.
  head_sha:
    description: >
      In signer-preflight mode, the exact live Pull Request head commit SHA
      observed after validation. Pass this value as 'expected-head-sha' to the
      write-capable signer so a force-push between jobs fails closed.
  base_sha:
    description: >
      In signer-preflight mode, the exact live Pull Request base commit SHA
      observed after validation. Pass this value as 'expected-base-sha' to the
      write-capable signer so a base-branch advance between jobs fails closed.
runs:
  using: "node24"
  main: 'dist/index.js'
